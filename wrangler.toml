"$schema" = "./node_modules/wrangler/config-schema.json"
name = "me-sergio-run"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-03-17"
compatibility_flags = ["global_fetch_strictly_public"]

[[routes]]
pattern = "me.sergio.run"
custom_domain = true

[assets]
binding = "ASSETS"
directory = "./dist"

[observability]
enabled = true